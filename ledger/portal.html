<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Portal</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">

    .portal-top { background: var(--side); color: #fff; padding: 18px 16px; }

    .portal-main { padding: 24px 16px 64px; }

<body data-helper="portal">
  <header class="portal-top"><div class="inner row between"><div class="brand" style="padding:0"><div class="brand-mark">L</div><div><b id="co-name">Client Portal</b><small>Your credit file, in one place</small></div></div><div id="portal-user" class="row"></div></div></header>
  <main class="portal-main" id="portal" aria-live="polite"><p class="muted">Loading…</p></main>
  <script src="js/law.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/helper.js"></script>

</html>
