<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Your Portrait Gallery | Custom Pet Portrait Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="nav"><a href="/" class="logo">👑 Custom Pet Portrait Studio</a></header>
  <section class="block" id="app"><div class="spinner"></div></section>
  <script>
    const id = location.pathname.split('/').pop();
    const app = document.getElementById('app');
    const MESSAGES = {
      pending_payment: ['Waiting for payment confirmation…', true],
      paid: ['Payment received! Our studio is starting on your portrait…', true],
      repainting: ['Repainting your portraits… this usually takes a few minutes. Your first set stays in your gallery, and we will email you when the new ones are ready.', true],
      generating: ['Painting your portraits… this usually takes a few minutes. You can close this page — we will email you.', true],
      printing: ['Sending your canvas to the print studio…', true],
      failed: ['We hit a snag painting this one. We retry automatically and our team has been notified — check back soon.', false],
      print_failed: ['We hit a snag sending your print. Our team has been notified and will email you shortly.', false],
      payment_mismatch: ['There was a problem matching your payment to this order. Our team has been notified and will contact you.', false],
    };
    let tracked = false;
    let styles = {};
    const stylesReady = fetch('/api/catalog').then((r) => r.json()).then((c) => { styles = c.styles || {}; }).catch(() => {});
    const supportLine = (email) => email ? `<p class="center support">Need help? Email <a href="mailto:${email}">${email}</a></p>` : '';
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

    async function load() {
      const [res] = await Promise.all([fetch(`/api/orders/${id}`), stylesReady]);
      if (!res.ok) { app.innerHTML = '<p class="center">Order not found.</p>'; return; }
      const o = await res.json();
      if (!tracked && new URLSearchParams(location.search).get('paid') && window.fbq) { fbq('track', 'Purchase'); tracked = true; }

      if (MESSAGES[o.status]) {
        const [msg, spin] = MESSAGES[o.status];
        app.innerHTML = `<h1 class="center">${o.petName ? esc(o.petName) + "'s" : 'Your'} portrait</h1>${spin ? '<div class="spinner"></div>' : ''}<p class="center">${msg}</p>${supportLine(o.supportEmail)}`;
        if (spin) setTimeout(load, 5000);
        return;
      }

      const choose = o.status === 'awaiting_selection';
      const head = choose
        ? '<p class="center"><strong>Pick your favorite to print on canvas.</strong> All 4 are yours to download either way.</p>'
        : o.status === 'sent_to_print'
          ? '<p class="center">✅ Your canvas is in production and will ship soon. Tracking arrives by email.</p>'
          : '<p class="center">Right-click or long-press to save — or use the download buttons.</p>';
      const nameEditor = o.canEditName ? `<div class="name-edit">
          <div>Nameplate reads: <strong>${o.petName ? esc(o.petName) : '(no name)'}</strong></div>
          <form id="nameForm"><input type="text" id="newName" maxlength="24" value="${esc(o.petName || '')}" placeholder="Pet's name (leave blank for none)">
          <button class="btn small" type="submit">Update nameplate</button></form>
          <small>Spelling wrong? Fix it here — all ${o.images.length} portraits update in seconds.</small></div>` : '';
      const tiles = (list) => `<div class="gallery">${list.map((img, i) => `
          <figure><img src="/files/${id}/${img}?v=${o.rev}" alt="Portrait version ${i + 1}" loading="lazy">
            <figcaption>
              <a class="btn small" href="/files/${id}/${img}?v=${o.rev}" download>Download</a>
              ${choose ? `<button class="btn small" data-img="${img}">Print this one</button>` : ''}
              ${o.selectedImage === img ? '<span>🖼️ Printing</span>' : ''}
            </figcaption></figure>`).join('')}</div>`;
      const until = o.repaint?.until ? new Date(o.repaint.until).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
      const repaintBox = o.repaint?.allowed ? `<div class="name-edit repaint">
          <div><strong>Not quite right?</strong> You have <strong>one free repaint</strong> (until ${until}, before printing).</div>
          <form id="repaintForm"><select id="repaintStyle">${Object.entries(styles).map(([k, n]) => `<option value="${k}" ${k === o.styleKey ? 'selected' : ''}>${esc(n)}${k === o.styleKey ? ' (same style)' : ''}</option>`).join('')}</select>
          <button class="btn small" type="submit">Repaint my portraits</button></form>
          <small>We paint 4 brand-new versions. Your current set stays here too. This can only be used once.</small></div>` : '';
      app.innerHTML = `<h1 class="center">${o.petName ? esc(o.petName) + "'s" : 'Your'} ${o.style || ''} portraits 👑</h1>${head}${nameEditor}
        ${tiles(o.images)}
        ${o.previousImages.length ? `<h2 class="center" style="margin-top:32px">Your first set</h2>${tiles(o.previousImages)}` : ''}
        ${repaintBox}
        ${o.channel === 'etsy' ? '' : '<p class="center" style="margin-top:24px">Love it? Share with a friend — they get 20% off with code <strong>FRIEND20</strong>.</p>'}${supportLine(o.supportEmail)}`;

      const nameForm = document.getElementById('nameForm');
      if (nameForm) nameForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = nameForm.querySelector('button');
        btn.disabled = true; btn.textContent = 'Updating…';
        const res = await fetch(`/api/orders/${id}/name`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ petName: document.getElementById('newName').value }) });
        if (!res.ok) alert((await res.json()).error || 'Could not update the name.');
        load();
      });

      const repaintForm = document.getElementById('repaintForm');
      if (repaintForm) repaintForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!confirm('Use your one free repaint? This can only be done once.')) return;
        const btn = repaintForm.querySelector('button');
        btn.disabled = true; btn.textContent = 'Starting…';
        const res = await fetch(`/api/orders/${id}/repaint`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ style: document.getElementById('repaintStyle').value }) });
        if (!res.ok) alert((await res.json()).error || 'Could not start the repaint.');
        load();
      });

      app.querySelectorAll('[data-img]').forEach((b) => b.addEventListener('click', async () => {
        if (!confirm('Print this version on canvas?')) return;
        b.disabled = true;
        await fetch(`/api/orders/${id}/select`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: b.dataset.img }) });
        load();
      }));
    }
    load();
  </script>
</body>
</html>
